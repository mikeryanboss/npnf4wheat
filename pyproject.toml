[project]
name = "npnf"
version = "0.1.0"
description = "Neural Process & Normalizing Flow implementation for plant phenotyping"
authors = [{ name = "Mike Boss", email = "mboss@ethz.ch" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.12,<3.12.7"
dependencies = [
    "accelerate>=0.33.0",
    "hydra-zen>=0.13.0",
    "wandb>=0.17.7",
    "jupyter>=1.0.0",
    "schedulefree>=1.2.7",
    "torchvision>=0.19.0",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "scikit-learn>=1.5.2",
    "scipy>=1.11",
    "normflows>=1.7.3",
    "zstd<1.5.6.3",
    "altair>=5.5.0",
    "torchdata>=0.11.0",
    "tensordict>=0.7.2",
    "einx>=0.3.0",
    "einops>=0.8.0",
    "transformers>=4.30.0",
    "torchmetrics>=1.7.1",
    "torchrl>=0.10.0",
    "duckdb>=1.3.1",
    "loguru>=0.7.3",
    "datasets>=4.0.0",
    "polars>=1.31.0",
    "zuko>=1.4.1",
    "gpytorch>=1.11",
    "pytest>=7.0",
    "imageio>=2.37.0",
    "torchdiffeq>=0.2.5",
    "submitit>=1.5.3",
    "hydra-submitit-launcher>=1.2.0",
    "optuna>=4.7.0",
    "statsmodels>=0.14.6",
    "pysiglib[cuda]>=3.0.3",
    "robustcov>=0.2.0",
    "typing-extensions>=4.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
output-format = "concise"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "wandb",
    "outputs",
]

line-length = 88

target-version = "py312"

[tool.ruff.lint]
select = [
    "E", # pycodestyle (Error)
    "F", # Pyflakes
    "I", # isort 
    "N", # pep8-naming
    # "D",      # pydocstyle
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    # "ANN",    # flake8-annotations
    "ASYNC", # flake8-async
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "EM",    # flake8-errmsg
    "EXE",   # flake8-executable
    "FA",    # flake8-future-annotations
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "G",     # flake8-logging-format
    "INP",   # flake8-no-pep420
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "SLOT",  # flake8-slot
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "INT",   # flake8-gettext
    "PTH",   # flake8-use-pathlib
    "TD",    # flake8-todo
    "FIX",   # flake8-fixme
    "ERA",   # eradicate
    "PGH",   # pygrep-hooks,
    "PL",    # Pylint
    "TRY",   # tryceratops
    "FLY",   # flynt
    "NPY",   # NumPy-specific-rules
    "AIR",   # Airflow
    "PERF",  # Perflint
    "RUF",   # Ruff-specific rules
]
ignore = [
    "N803",    # invalid-argument-name
    "N806",    # non-lowercase-variable-in-function
    "N812",    # lowercase-imported-as-non-lowercase
    "FBT001",  # boolean-type-hint-positional-argument
    "FBT002",  # boolean-default-value-positional-argument
    "FBT003",  # boolean-positional-value-in-call (matplotlib grid/legend)
    "B023",    # function-uses-loop-variable
    "G004",    # logging-f-string
    "PLC0415", # import-outside-top-level (intentional lazy imports)
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "PLW2901", # redefined-loop-name
    "NPY002",  # numpy-legacy-random
    "COM812",  # missing-trailling-comma
    "PGH003",  # blanket-type-ignore
    "FIX002",  # line-contains-todo,
    "TD003",   # missing-issue-link
    "ISC001",  # single-line-implicit-string-concatenation
    "PYI041",  # missing-type-annotation-for-implicit-none
    "RUF001",  # ambiguous-unicode-character (σ, ° in labels)
    "RUF003",
]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ty.terminal]
output-format = "concise"

[dependency-groups]
dev = [
    "ruff==0.16.8",
]
